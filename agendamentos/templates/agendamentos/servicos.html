<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Igor Rocha Barbearia</title>
</head>
<body>
    <a href="{% url 'logout_profissional' %}">
    <button type="button">Sair</button>
    </a>

    
    <form method="post">
        {% csrf_token %}
        
        <label for="nome">Nome do Serviço: </label>
        <input type="text" id="nome" name="nome">

        <label for="preco">Preço:</label>
        <input type="number" id="preco" name="preco" step="0.01">

        <label for="duracao">Duração (minutos):</label>
        <input type="number" id="duracao" name="duracao">

        <button type="submit">Cadastrar Serviço</button>
    </form>

    <div id="listar_servicos">
        <h2>Listar Serviços</h2>
        <ul>
            {% for servico in servicos %}
                <a href="{% url 'editar_servico' servico.id %}">Editar</a>

                <form method="POST" action="{% url 'excluir_servico' servico.id %}">
                    {% csrf_token %}
                    <button type="submit">Excluir</button>
                </form>

                <li>
                    {{servico.nome}}
                    {{servico.preco}}
                    {{servico.duracao}}
                </li>
            {% endfor %} 
        </ul>
    </div>
    {% if erro %}
    <p>{{ erro }}</p>
    {% endif %}
</body>
</html>
