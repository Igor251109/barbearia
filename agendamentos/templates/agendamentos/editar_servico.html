<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Serviço</title>
</head>
<body>

    <h1>Editar Serviço</h1>

    <form method="POST">
        {% csrf_token %}

        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" value="{{ servico.nome }}" required>

        <label for="preco">Preço:</label>
        <input type="number" id="preco" name="preco" step="0.01" value="{{ servico.preco }}" required>

        <label for="duracao">Duração (minutos):</label>
        <input type="number" id="duracao" name="duracao" value="{{ servico.duracao }}" required>

        <button type="submit">Salvar alterações</button>

        {% if erro %}
        <p>{{ erro }}</p>
        {% endif %}
    </form>
</body>
</html>
